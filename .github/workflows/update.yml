name: Actualizar datos

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar la API de Riot
        run: node scripts/update.mjs
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Guardar cambios
        run: |
          git config user.name "soloq-bot"
          git config user.email "soloq-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualizar datos"
            git push
          fi
