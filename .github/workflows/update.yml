name: Actualizar datos

# GitHub se salta muchas ejecuciones de los cron frecuentes, así que cada ejecución se queda viva
# ~5h30m en un bucle propio. El cron horario solo sirve para relanzarla (si ya hay una en marcha,
# la nueva espera en cola).
#
# Cada minuto: pasada rápida (1 petición por cuenta) que solo actualiza a quien ha jugado.
# Cada ~15 min: pasada completa + descarga en segundo plano de partidas antiguas (BACKFILL_BUDGET).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Actualizar en bucle
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          LOOP_SECONDS: 19800    # ~5h30m (margen para que la última vuelta termine antes del límite de 6 h)
          CYCLE_SECONDS: 60      # una pasada rápida por minuto
          FULL_EVERY: 15         # una pasada completa cada 15 ciclos
          BACKFILL_BUDGET: 120   # partidas antiguas por pasada completa
        run: |
          git config user.name "soloq-bot"
          git config user.email "soloq-bot@users.noreply.github.com"
          end=$((SECONDS + LOOP_SECONDS))
          i=0
          while [ $SECONDS -lt $end ]; do
            t0=$SECONDS
            # Coger cambios de código o datos subidos mientras tanto
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            if [ $((i % FULL_EVERY)) -eq 0 ]; then
              node scripts/update.mjs || echo "::warning::La pasada completa ha fallado; se reintenta más tarde"
            else
              node scripts/update.mjs --quick || echo "::warning::La pasada rápida ha fallado"
            fi
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "Actualizar datos"
              for n in 1 2 3; do
                git pull -q --rebase origin main && git push -q origin HEAD:main && break
                sleep 5
              done
            fi
            i=$((i + 1))
            left=$((CYCLE_SECONDS - (SECONDS - t0)))
            [ $left -gt 0 ] && sleep $left
          done
